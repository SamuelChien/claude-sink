apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-metrics-exporter
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-metrics-exporter
  template:
    metadata:
      labels:
        app: kafka-metrics-exporter
    spec:
      containers:
      - name: exporter
        image: danielqsj/kafka-exporter:latest
        ports:
        - containerPort: 9308
        args:
        - --kafka.server=kafka.kafka.svc.cluster.local:29092
        - --topic.filter=sink\..*
        - --group.filter=sink-.*
        resources:
          requests:
            memory: "64Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-metrics-exporter
  namespace: kafka
spec:
  selector:
    app: kafka-metrics-exporter
  ports:
  - port: 9308
    targetPort: 9308
